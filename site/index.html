<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Property Portal</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
:root{--bg:#14181c;--card:#1d2329;--line:#333c45;--text:#eef1f3;--dim:#a3adb6;--accent:#f2c230;--pos:#5cc285;--neg:#e0796f}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,Segoe UI,sans-serif}
body{display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:16px;padding:8px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header img{height:34px}
h1{font-size:18px;margin:0}
.sub{color:var(--dim);font-size:12px}
nav{display:flex;gap:4px;margin-left:auto}
nav button{background:none;border:1px solid transparent;color:var(--dim);padding:7px 14px;border-radius:4px;cursor:pointer;font:inherit}
nav button.on{color:var(--text);border-color:var(--line);background:var(--card)}
main{flex:1;min-height:0;position:relative}
.tab{position:absolute;inset:0;display:none}
.tab.on{display:block}
#live iframe{border:0;width:100%;height:100%}
#plan.on{display:grid;grid-template-columns:1fr 400px}
#map{height:100%}
#side{overflow-y:auto;border-left:1px solid var(--line)}
section{padding:12px 16px;border-bottom:1px solid var(--line)}
h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin:0 0 8px;display:flex;justify-content:space-between}
h2 a{text-transform:none;letter-spacing:0;color:var(--dim);cursor:pointer}
h3{margin:0 0 2px;font-size:17px}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--dim);font-weight:400;font-size:12px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.legend span{display:inline-flex;align-items:center;gap:5px;margin:0 10px 4px 0;font-size:12px}
.legend i{width:12px;height:12px;border-radius:2px;display:inline-block}
.yr{cursor:pointer}
.yr:hover,.yr.on{background:var(--card)}
.yr.on td:first-child{box-shadow:inset 3px 0 var(--accent)}
.hint{color:var(--dim);font-size:12px}
.maplibregl-popup-content{background:var(--card);color:var(--text);font-size:13px}
.maplibregl-popup-tip{border-top-color:var(--card)!important;border-bottom-color:var(--card)!important}
.maplibregl-popup-content button{margin-top:4px;cursor:pointer}
.page.on{overflow-y:auto}
.wrap{max-width:1100px;margin:0 auto;padding:8px 16px 40px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:8px 0 4px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.kpi b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.kpi span{color:var(--dim);font-size:12px}
#bars{width:100%;height:220px;display:block}
#bars rect.hit{fill:transparent}
#bars g:hover rect.v{opacity:.8}
.tip{position:fixed;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:6px 8px;font-size:12px;display:none;z-index:5}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:10px}
.charts img{width:100%;background:#fff;border-radius:4px}
tr.tot td{font-weight:600;border-top:2px solid var(--line)}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.filters button{background:var(--card);border:1px solid var(--line);color:var(--dim);padding:5px 10px;border-radius:4px;cursor:pointer;font:inherit;font-size:13px}
.filters button.on{color:var(--text);border-color:var(--accent)}
.due{white-space:nowrap}.soon{color:var(--accent)}
tr.op{cursor:pointer}tr.op:hover{background:var(--card)}
.tag{font-size:11px;padding:1px 6px;border-radius:9px;border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.edit td{background:var(--card)}
.edit form{display:flex;flex-wrap:wrap;gap:8px;align-items:end;padding:6px 0}
.edit label{display:grid;gap:2px;font-size:12px;color:var(--dim)}
.edit input,.edit select,.edit button{font:inherit;font-size:13px;padding:5px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:4px}
.edit button{background:var(--accent);color:#14181c;border:0;padding:6px 12px;cursor:pointer}
.err{color:var(--neg)}
@media (max-width:800px){#plan.on{grid-template-columns:1fr;grid-template-rows:50% 50%}#side{border-left:0;border-top:1px solid var(--line)}nav{margin-left:0}}
</style>
</head>
<body>
<header>
  <img src="logo.png" alt="JT Land">
  <div><h1 id="name">Property</h1><div class="sub" id="acres"></div></div>
  <nav>
    <button data-tab="live">Live</button>
    <button data-tab="plan">Stands and Plan</button>
    <button data-tab="fin">Financials</button>
    <button data-tab="cal" hidden>Calendar</button>
  </nav>
</header>
<main>
  <div class="tab" id="live"></div>
  <div class="tab" id="plan">
    <div id="map"></div>
    <div id="side">
      <section id="stand"><h2>Stand</h2><div class="hint">Click a stand on the map.</div></section>
      <section><h2>Harvest and planting plan <a id="clear" hidden>show all</a></h2>
        <div class="hint" style="margin-bottom:6px">Click a year to see its stands on the map.</div>
        <table id="years"></table></section>
      <section><h2>Stand types</h2><div class="legend" id="legend"></div></section>
    </div>
  </div>
  <div class="tab page" id="fin"><div class="wrap">
    <div class="kpis" id="kpis"></div>
    <div class="hint" id="finnote"></div>
    <section><h2>After-tax cash flow by year</h2><svg id="bars" role="img" aria-label="After-tax cash flow by year"></svg></section>
    <section><h2>Cash flow statement</h2><table id="stmt"></table></section>
    <section><h2>TimberFlow charts</h2><div class="charts" id="charts"></div></section>
  </div></div>
  <div class="tab page" id="cal"><div class="wrap">
    <div class="kpis" id="next"></div>
    <section><h2>Calendar and deadlines <span class="hint" id="asof"></span></h2>
      <div class="filters" id="filters"></div>
      <div class="hint" id="edithint" style="margin-bottom:6px"></div>
      <table id="obl"></table></section>
  </div></div>
</main>
<div class="tip" id="tip"></div>
<div id="gate" style="position:fixed;inset:0;z-index:99;display:none;align-items:center;justify-content:center;background:#14181c">
<div style="display:grid;gap:12px;width:min(320px,90vw)"><img src="logo.png" alt="JT Land" style="height:40px;justify-self:center">
<input id="pw" type="password" placeholder="Passphrase" autofocus style="font:inherit;padding:10px;border-radius:4px;border:1px solid #333c45;background:#1d2329;color:#eef1f3">
<button id="go" style="font:inherit;padding:10px;border-radius:4px;border:0;background:#f2c230;color:#14181c;cursor:pointer">Open</button>
<p id="msg" style="color:#e0796f;margin:0;text-align:center"></p></div></div>
<script>
const realFetch = window.fetch.bind(window);
let FILES = {}, LIVEKEY;
window.portalFetch = async (url, opt) => {
  const u = String(url).split('?')[0].replace(/^\//, '');
  if (u === 'api/edit') return new Response('', {status: 404});  // read-only link
  if (u === 'api/status') {
    const e = await (await realFetch('live/status.enc?t=' + Date.now(), {cache: 'no-store'})).json();
    return new Response(await crypto.subtle.decrypt({name: 'AES-GCM', iv: raw(e.iv)}, LIVEKEY, raw(e.ct)));
  }
  const f = FILES[u] ?? FILES['data/' + u];
  return f === undefined ? realFetch(url, opt) : new Response(f);
};
window.fetch = portalFetch;
async function render(p) {
  FILES = window.FILES = p.files;
  window.LIVE_CFG = p.live;
  LIVEKEY = await crypto.subtle.importKey('raw', raw(p.key), 'AES-GCM', false, ['decrypt']);
  const s = document.createElement('script');
  s.textContent = p.script;
  document.body.append(s);
}

var raw = function(s){return Uint8Array.from(atob(s), function(c){return c.charCodeAt(0)})};
document.getElementById('gate').style.display = 'flex';
document.getElementById('go').onclick = async function(){
  var msg = document.getElementById('msg'), pw = document.getElementById('pw').value;
  msg.textContent = 'Decrypting...';
  try {
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt:raw(ENC.salt), iterations:ENC.iter, hash:'SHA-256'},
      base, {name:'AES-GCM', length:256}, false, ['decrypt']);
    var out = await crypto.subtle.decrypt({name:'AES-GCM', iv:raw(ENC.iv)}, key, raw(ENC.ct));
    document.getElementById('gate').remove();
    render(JSON.parse(new TextDecoder().decode(out)));
  } catch(e) { msg.textContent = 'Wrong passphrase.'; }
};
document.getElementById('pw').addEventListener('keydown', function(e){
  if (e.key === 'Enter') document.getElementById('go').click();
});
